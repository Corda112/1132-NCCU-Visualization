apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bitcoin-sentiment-app
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # 自動調整設定
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # 記憶體和 CPU 設定
        run.googleapis.com/memory: "512Mi"
        run.googleapis.com/cpu: "1000m"
        # 請求超時
        run.googleapis.com/timeout: "300"
    spec:
      containerConcurrency: 100
      containers:
      - image: gcr.io/PROJECT_ID/bitcoin-sentiment-app
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        resources:
          limits:
            memory: "512Mi"
            cpu: "1000m"
          requests:
            memory: "256Mi"
            cpu: "500m"
        # 健康檢查
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5 